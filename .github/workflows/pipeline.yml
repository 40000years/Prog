# ============================================================
# GitHub Actions CI/CD Pipeline (Terraform Action Driven)
# ============================================================
# Pipeline ที่ควบคุมการ Provision และ Deploy ทั้งหมดผ่าน Terraform Action

name: "🚀 Mega Automation Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TF_VAR_aws_region: "ap-southeast-7"
  TF_VAR_instance_type: "t4g.micro"
  TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  # ============================================================
  # Job 1: Detect Changes (ตรวจสอบการเปลี่ยนแปลง)
  # ============================================================
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      ansible: ${{ steps.filter.outputs.ansible }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'terraform/**'
              - '.github/workflows/pipeline.yml'
            ansible:
              - 'ansible/**'
              - '.github/workflows/pipeline.yml'
            app:
              - 'app/**'
              - '.github/workflows/pipeline.yml'

  # ============================================================
  # Job 2: Code Validation (เช็คความถูกต้อง)
  # ============================================================
  validate:
    name: "🧪 Code Validation"
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node.js Application Validation ---
      - name: Setup Node.js
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node.js Syntax & Unit Check
        if: needs.changes.outputs.app == 'true'
        working-directory: ./app
        run: |
          npm test
          node -c index.js

      # --- Terraform Validation ---
      - name: Setup Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Terraform Format Check
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init & Validate
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

      # --- Ansible Validation ---
      - name: Setup Python
        if: needs.changes.outputs.ansible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        if: needs.changes.outputs.ansible == 'true'
        run: pip install ansible

      - name: Ansible Syntax Check
        if: needs.changes.outputs.ansible == 'true'
        working-directory: ./ansible
        run: ansible-playbook playbook.yml --syntax-check

  # ============================================================
  # Job 3: Unified Provision & Deploy (Via Terraform Action)
  # ============================================================
  provision:
    name: "🏗️ Provision & Deploy (Terraform Action)"
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      web_ip: ${{ steps.tf_output.outputs.web_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Setup Python for Ansible Provider
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible Dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.postgresql community.general

      - name: Create S3 bucket for Terraform state (ถ้ายังไม่มี)
        run: |
          BUCKET="mega-automation-lab-tfstate"
          REGION="ap-southeast-7"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket '$BUCKET' already exists"
          else
            echo "🪣 Creating S3 bucket '$BUCKET'..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "✅ Bucket created successfully"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Prepare SSH Key
        working-directory: ./terraform
        run: |
          terraform output -raw private_key_pem > /tmp/id_rsa 2>/dev/null || true
          if [ -s /tmp/id_rsa ]; then
            chmod 600 /tmp/id_rsa
            echo "✅ Existing SSH key loaded"
          else
            echo "ℹ️ New deployment: key will be generated by Terraform"
          fi

      # รัน Terraform Apply เพื่อสร้าง Infrastructure
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve
          terraform output -raw private_key_pem > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          ssh-keygen -l -f /tmp/id_rsa && echo "✅ Key is valid"

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ./terraform
        run: |
          WEB_IP=$(terraform output -raw web_server_public_ip 2>/dev/null || echo "")
          DB_IP=$(terraform output -raw db_server_public_ip 2>/dev/null || echo "")
          echo "web_ip=${WEB_IP}" >> $GITHUB_OUTPUT
          echo "db_ip=${DB_IP}" >> $GITHUB_OUTPUT
          echo ""
          echo "====================================="
          echo "📋 Infrastructure Summary"
          echo "====================================="
          echo "🌐 Web Server IP: ${WEB_IP}"
          echo "🗄️  DB Server IP:  ${DB_IP}"
          echo "🔗 Web URL:        http://${WEB_IP}"
          echo "====================================="

      # รอให้ SSH Port 22 บนเครื่อง EC2 พร้อมรับ Connection
      - name: Wait for SSH to be ready
        run: |
          WEB_IP="${{ steps.tf_output.outputs.web_ip }}"
          echo "🔍 Checking SSH readiness on ${WEB_IP}:22..."
          for i in {1..20}; do
            if nc -z -w 3 "$WEB_IP" 22 2>/dev/null; then
              echo "✅ SSH is ready on ${WEB_IP}!"
              break
            fi
            echo "⏳ Waiting for SSH (attempt $i/20)..."
            sleep 3
          done

      # รัน Ansible Playbook เพื่อติดตั้งและ Deploy ทั้งหมด
      - name: 🚀 Run Ansible Playbook (Full Configuration & Deployment)
        working-directory: ./ansible
        run: |
          echo "===================================================="
          echo "🚀 Executing Ansible Master Playbook"
          echo "===================================================="
          ansible-playbook \
            -i inventory/aws_ec2.yml \
            playbook.yml \
            --private-key /tmp/id_rsa \
            -u ubuntu \
            -e "db_host=${{ steps.tf_output.outputs.db_ip }}" \
            -v

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/id_rsa

  # ============================================================
  # Job 4: Smoke Test (ทดสอบว่าเว็บใช้งานได้)
  # ============================================================
  smoke-test:
    name: "🧪 Smoke Test"
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Test Health Endpoint (Smart Polling)
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🏥 Testing http://${WEB_IP}/health ..."
          
          SUCCESS=0
          for i in {1..15}; do
            RESPONSE=$(curl -s --max-time 5 "http://${WEB_IP}/health" || echo "")
            if echo "$RESPONSE" | grep -q "healthy"; then
              echo "✅ Health check passed on attempt $i!"
              SUCCESS=1
              break
            fi
            echo "⏳ Service starting up... retry in 3s ($i/15)"
            sleep 3
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Health check failed after 15 attempts"
            exit 1
          fi

      - name: Test Web Homepage
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🌐 Testing http://${WEB_IP} ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://${WEB_IP}/" || echo "000")
          echo "HTTP Status Code: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 304 ]; then
            echo "✅ Storefront is up and serving traffic (HTTP ${HTTP_STATUS})"
          else
            echo "❌ Unexpected HTTP status code: ${HTTP_STATUS}"
            exit 1
          fi
