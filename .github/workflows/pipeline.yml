# ============================================================
# GitHub Actions CI/CD Pipeline
# ============================================================
# Pipeline นี้จะทำงานอัตโนมัติเมื่อ Push Code ขึ้น GitHub
# แบ่งเป็น 4 Jobs:
#   1. validate    - ตรวจสอบความถูกต้องของโค้ด
#   2. provision   - สร้าง Infrastructure บน AWS ด้วย Terraform
#   3. configure   - ตั้งค่า Server และ Deploy App ด้วย Ansible
#   4. smoke-test  - ทดสอบว่าเว็บใช้งานได้จริง

name: "🚀 Mega Automation Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TF_VAR_aws_region: "ap-southeast-7"
  TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
  ANSIBLE_HOST_KEY_CHECKING: "False"

# ============================================================
# Job 1: Code Validation (เช็คโค้ดก่อนรันจริง)
# ============================================================
jobs:
  validate:
    name: "🔍 Code Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Terraform Validation ---
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init (for validation only)
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      # --- Ansible Validation ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & ansible-lint
        run: |
          pip install ansible ansible-lint

      - name: Ansible Lint
        working-directory: ./ansible
        run: ansible-lint playbook.yml
        continue-on-error: true  # Warning เฉยๆ ไม่ block pipeline

      - name: Ansible Syntax Check
        working-directory: ./ansible
        run: ansible-playbook playbook.yml --syntax-check

      # --- Security Scan ---
      - name: Run tfsec (Terraform Security Scanner)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ./terraform
          soft_fail: true

  # ============================================================
  # Job 2: Infrastructure Provisioning (สร้าง Infrastructure)
  # ============================================================
  provision:
    name: "🏗️ Infrastructure Provisioning"
    runs-on: ubuntu-latest
    needs: validate  # ต้องผ่าน validation ก่อน
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      web_ip: ${{ steps.tf_output.outputs.web_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Debug AWS Account Identity
        run: |
          echo "====================================="
          echo "🔐 Checking AWS Identity..."
          aws sts get-caller-identity
          echo "====================================="
          echo "💡 โปรดตรวจสอบว่า Account ID ที่แสดงด้านบน ตรงกับเลข Account ID"
          echo "   ที่คุณล็อกอินอยู่ในหน้าเว็บ AWS Console หรือไม่"
          echo "   (บางครั้ง Access Key ใน GitHub Secrets อาจมาจากคนละ Account กัน)"
          echo "====================================="

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Detect workable instance type (dry-run)
        id: detect_instance
        run: |
          echo "====================================="
          echo "🔍 Querying which types are free-tier eligible (metadata)..."
          FREE_TIER_TYPES=$(aws ec2 describe-instance-types \
            --filters "Name=free-tier-eligible,Values=true" \
            --query "InstanceTypes[].InstanceType" \
            --output text 2>/dev/null || echo "none")
          echo "Free-tier eligible types (metadata): ${FREE_TIER_TYPES}"
          echo "====================================="

          echo "🧪 Testing instance types with actual DRY-RUN..."
          echo "====================================="

          # หา AMI สำหรับทดสอบ
          AMI_AMD64=$(aws ec2 describe-images \
            --owners 099720109477 \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
              "Name=state,Values=available" "Name=architecture,Values=x86_64" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text 2>/dev/null || echo "")

          AMI_ARM64=$(aws ec2 describe-images \
            --owners 099720109477 \
            --filters \
              "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-arm64-server-*" \
              "Name=state,Values=available" "Name=architecture,Values=arm64" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text 2>/dev/null || echo "")

          echo "amd64 AMI: ${AMI_AMD64}"
          echo "arm64 AMI: ${AMI_ARM64}"
          echo "====================================="

          SELECTED=""

          # ทดสอบทีละ type ด้วย dry-run จริงๆ
          for TYPE in t4g.micro t4g.small t3.micro t2.micro t3.small t3a.micro t3a.small; do
            # เลือก AMI ตาม architecture
            if echo "$TYPE" | grep -q "^t4g"; then
              TEST_AMI="$AMI_ARM64"
            else
              TEST_AMI="$AMI_AMD64"
            fi

            if [ -z "$TEST_AMI" ]; then
              echo "⏭️  $TYPE: skipped (no AMI for arch)"
              continue
            fi

            RESULT=$(aws ec2 run-instances \
              --image-id "$TEST_AMI" \
              --instance-type "$TYPE" \
              --credit-specification CpuCredits=standard \
              --count 1 \
              --dry-run 2>&1 || true)

            if echo "$RESULT" | grep -q "DryRunOperation"; then
              echo "✅ $TYPE: ALLOWED"
              SELECTED="$TYPE"
              break
            else
              ERR=$(echo "$RESULT" | grep -oE 'api error [^:]+: [^(]+' | head -1)
              echo "❌ $TYPE: BLOCKED — ${ERR}"
            fi
          done

          echo "====================================="
          if [ -z "$SELECTED" ]; then
            echo "⚠️  WARNING: No working instance type found via dry-run!"
            echo "   ต้องตรวจสอบสิทธิ์ของ AWS account นี้"
            echo "   Falling back to t3.micro (pipeline may fail)"
            SELECTED="t3.micro"
          else
            echo "🎯 Selected instance type: ${SELECTED}"
          fi
          echo "====================================="
          echo "TF_VAR_instance_type=${SELECTED}" >> $GITHUB_ENV

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ./terraform
        run: |
          echo "web_ip=$(terraform output -raw web_server_public_ip)" >> $GITHUB_OUTPUT
          echo "db_ip=$(terraform output -raw db_server_public_ip)" >> $GITHUB_OUTPUT
          echo ""
          echo "====================================="
          echo "📋 Infrastructure Summary"
          echo "====================================="
          echo "🌐 Web Server IP: $(terraform output -raw web_server_public_ip)"
          echo "🗄️  DB Server IP:  $(terraform output -raw db_server_public_ip)"
          echo "🔗 Web URL:        $(terraform output -raw web_url)"
          echo "====================================="

      # เก็บ Terraform state ไว้ใช้ในรอบถัดไป (ถ้าจะทำ destroy)
      - name: Upload Terraform State
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          retention-days: 7

  # ============================================================
  # Job 3: Configuration Management (ตั้งค่า Server + Deploy)
  # ============================================================
  configure:
    name: "⚙️ Configuration & Deployment"
    runs-on: ubuntu-latest
    needs: provision  # ต้องสร้าง Infrastructure ก่อน

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & AWS dependencies
        run: |
          pip install ansible boto3 botocore

      - name: Install Ansible AWS collection
        run: |
          ansible-galaxy collection install amazon.aws community.postgresql community.general

      - name: Setup SSH Private Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

      # รอให้ EC2 instances พร้อมรับ SSH (ใหม่ ๆ อาจยังบูตไม่เสร็จ)
      - name: Wait for EC2 instances to be ready
        run: |
          echo "⏳ Waiting 60 seconds for EC2 instances to initialize..."
          sleep 60

      - name: Run Ansible Playbook
        working-directory: ./ansible
        run: |
          ansible-playbook \
            -i inventory/aws_ec2.yml \
            playbook.yml \
            --private-key /tmp/id_rsa \
            -u ubuntu \
            -v

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/id_rsa

  # ============================================================
  # Job 4: Smoke Test (ทดสอบว่าเว็บใช้งานได้)
  # ============================================================
  smoke-test:
    name: "🧪 Smoke Test"
    runs-on: ubuntu-latest
    needs: [provision, configure]

    steps:
      - name: Wait for application to start
        run: |
          echo "⏳ Waiting 30 seconds for the application to fully start..."
          sleep 30

      - name: Test Web Server HTTP Response
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🌐 Testing http://${WEB_IP} ..."
          echo ""

          # ทดสอบ HTTP Status Code
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "http://${WEB_IP}")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ HTTP Status: ${HTTP_STATUS} - SUCCESS!"
          else
            echo "❌ HTTP Status: ${HTTP_STATUS} - FAILED!"
            exit 1
          fi

      - name: Test Health Endpoint
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🏥 Testing http://${WEB_IP}/health ..."
          echo ""

          # ทดสอบ Health Endpoint
          RESPONSE=$(curl -s --max-time 30 "http://${WEB_IP}/health")
          echo "Response: ${RESPONSE}"

          # เช็คว่า response มีคำว่า "healthy" ไหม
          if echo "$RESPONSE" | grep -q "healthy"; then
            echo ""
            echo "✅ Health check passed!"
          else
            echo ""
            echo "❌ Health check failed!"
            exit 1
          fi

      - name: Print Deployment Summary
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo ""
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "============================================"
          echo "🌐 Web Application: http://${WEB_IP}"
          echo "🏥 Health Check:    http://${WEB_IP}/health"
          echo "============================================"
