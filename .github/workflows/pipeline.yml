# ============================================================
# GitHub Actions CI/CD Pipeline (Smart Fast Deploy)
# ============================================================
# Pipeline แบบแยกการทำงานตามสิ่งที่เปลี่ยนแปลง (Path-based Filtering):
#   - ถ้าแก้เฉพาะ 'app/**' (UI / Backend):
#     ⚡ Fast Deploy: ข้าม Terraform, อัปเดตเฉพาะแอปผ่าน Ansible Tag (~30-45 วินาที)
#   - ถ้าแก้ 'terraform/**' หรือ 'ansible/**':
#     🔨 Full Provision: รัน Terraform + ตั้งค่า Server เต็มรูปแบบ

name: "🚀 Mega Automation Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TF_VAR_aws_region: "ap-southeast-7"
  TF_VAR_instance_type: "t4g.micro"
  TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  # ============================================================
  # Job 1: Detect Changes (ตรวจสอบว่าไฟล์ส่วนไหนเปลี่ยนบ้าง)
  # ============================================================
  changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      ansible: ${{ steps.filter.outputs.ansible }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'terraform/**'
              - '.github/workflows/pipeline.yml'
            ansible:
              - 'ansible/**'
              - '.github/workflows/pipeline.yml'
            app:
              - 'app/**'
              - '.github/workflows/pipeline.yml'

  # ============================================================
  # Job 2: Code Validation (เช็คโค้ดก่อนรันจริง)
  # ============================================================
  validate:
    name: "🧪 Code Validation"
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node.js Application Validation ---
      - name: Setup Node.js
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node.js Syntax & Unit Check
        if: needs.changes.outputs.app == 'true'
        working-directory: ./app
        run: |
          npm test
          node -c index.js

      # --- Terraform Validation (เมื่อมีการแก้ไข Terraform) ---
      - name: Setup Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init & Validate
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform
        run: |
          terraform init -backend=false
          terraform validate

      # --- Ansible Validation (เมื่อมีการแก้ไข Ansible) ---
      - name: Setup Python
        if: needs.changes.outputs.ansible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        if: needs.changes.outputs.ansible == 'true'
        run: pip install ansible

      - name: Ansible Syntax Check
        if: needs.changes.outputs.ansible == 'true'
        working-directory: ./ansible
        run: ansible-playbook playbook.yml --syntax-check

  # ============================================================
  # Job 3: Infrastructure Provisioning (Terraform)
  # ============================================================
  provision:
    name: "🏗️ Infrastructure Provisioning"
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      web_ip: ${{ steps.tf_output.outputs.web_ip }}
      is_infra_changed: ${{ needs.changes.outputs.infra }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Create S3 bucket for Terraform state (ถ้ายังไม่มี)
        run: |
          BUCKET="mega-automation-lab-tfstate"
          REGION="ap-southeast-7"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket '$BUCKET' already exists"
          else
            echo "🪣 Creating S3 bucket '$BUCKET'..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "✅ Bucket created successfully"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # รัน Terraform Apply เฉพาะเมื่อมีการเปลี่ยนแปลงในส่วน infra
      - name: Terraform Apply (Infra Changed)
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform
        run: terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ./terraform
        run: |
          WEB_IP=$(terraform output -raw web_server_public_ip 2>/dev/null || echo "")
          DB_IP=$(terraform output -raw db_server_public_ip 2>/dev/null || echo "")
          echo "web_ip=${WEB_IP}" >> $GITHUB_OUTPUT
          echo "db_ip=${DB_IP}" >> $GITHUB_OUTPUT
          echo ""
          echo "====================================="
          echo "📋 Infrastructure Summary"
          echo "====================================="
          echo "🌐 Web Server IP: ${WEB_IP}"
          echo "🗄️  DB Server IP:  ${DB_IP}"
          echo "🔗 Web URL:        http://${WEB_IP}"
          echo "====================================="

  # ============================================================
  # Job 4: Configuration Management (ตั้งค่า Server + Deploy)
  # ============================================================
  configure:
    name: "⚙️ Configuration & Fast Deploy"
    runs-on: ubuntu-latest
    needs: [changes, provision]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible & AWS dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.postgresql community.general

      - name: Setup Terraform (for SSH Key)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup SSH Private Key
        working-directory: ./terraform
        run: |
          terraform init -input=false
          terraform output -raw private_key_pem > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          ssh-keygen -l -f /tmp/id_rsa && echo "✅ Key is valid" || echo "❌ Key is INVALID"

      # Smart Poll: เช็คว่า Port SSH พร้อมใช้งานหรือยัง (แทนการ sleep 60 วินาทีแบบตายตัว)
      - name: Wait for SSH to be ready
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🔍 Checking SSH readiness on ${WEB_IP}:22..."
          for i in {1..20}; do
            if nc -z -w 3 "$WEB_IP" 22 2>/dev/null; then
              echo "✅ SSH is ready on ${WEB_IP}!"
              break
            fi
            echo "⏳ Waiting for SSH (attempt $i/20)..."
            sleep 3
          done

      # ถ้าแก้เฉพาะ Application (UI/Backend) ➔ ใช้ Fast Deploy (ไม่ไปรัน Nginx/Postgres ใหม่)
      - name: Fast Deploy Application (App Only)
        if: needs.changes.outputs.infra != 'true' && needs.changes.outputs.ansible != 'true'
        working-directory: ./ansible
        run: |
          echo "⚡ Fast Deploy: Syncing app files and restarting service..."
          ansible-playbook \
            -i inventory/aws_ec2.yml \
            playbook.yml \
            --tags deploy \
            --limit tag_Role_web \
            --private-key /tmp/id_rsa \
            -u ubuntu \
            -v

      # ถ้ามีการแก้ Infra หรือ Ansible ➔ รัน Full Configuration Playbook
      - name: Full Configuration Playbook (Infra/Ansible Changed)
        if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.ansible == 'true'
        working-directory: ./ansible
        run: |
          echo "🔨 Full Configuration: Running entire server configuration..."
          ansible-playbook \
            -i inventory/aws_ec2.yml \
            playbook.yml \
            --private-key /tmp/id_rsa \
            -u ubuntu \
            -v

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/id_rsa

  # ============================================================
  # Job 5: Smoke Test (ทดสอบว่าเว็บใช้งานได้)
  # ============================================================
  smoke-test:
    name: "🧪 Smoke Test"
    runs-on: ubuntu-latest
    needs: [provision, configure]

    steps:
      # Smart Poll: เช็ค HTTP Health Endpoint ทันทีที่พร้อม (แทนการ sleep 30 วินาที)
      - name: Test Health Endpoint (Smart Polling)
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo "🏥 Testing http://${WEB_IP}/health ..."
          
          SUCCESS=0
          for i in {1..15}; do
            RESPONSE=$(curl -s --max-time 5 "http://${WEB_IP}/health" || echo "")
            if echo "$RESPONSE" | grep -q "healthy"; then
              echo "✅ Health check passed on attempt $i!"
              echo "Response: $RESPONSE"
              SUCCESS=1
              break
            fi
            echo "⏳ Waiting for app to respond (attempt $i/15)..."
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "❌ Health check timed out or failed!"
            exit 1
          fi

      - name: Print Deployment Summary
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          echo ""
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL!"
          echo "============================================"
          echo "🌐 Web Application: http://${WEB_IP}"
          echo "🏥 Health Check:    http://${WEB_IP}/health"
          echo "============================================"
