# ============================================================
# GitHub Actions CI/CD Pipeline (Terraform Action Driven)
# ============================================================

name: "Mega Automation Pipeline"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  TF_VAR_aws_region: "ap-southeast-7"
  TF_VAR_instance_type: "t4g.micro"
  TF_VAR_key_name: ${{ secrets.AWS_KEY_NAME }}
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  # ============================================================
  # Job 1: Detect Changes
  # ============================================================
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      ansible: ${{ steps.filter.outputs.ansible }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'terraform-wiki/**'
              - '.github/workflows/pipeline.yml'
            ansible:
              - 'ansible/**'
              - '.github/workflows/pipeline.yml'
            app:
              - 'app/**'
              - '.github/workflows/pipeline.yml'

  # ============================================================
  # Job 2: Code Validation
  # ============================================================
  validate:
    name: "Code Validation"
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Node.js Application Validation ---
      - name: Setup Node.js
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build and validate wiki
        if: needs.changes.outputs.app == 'true'
        working-directory: ./app
        run: |
          npm ci
          npm run typecheck
          SITE_STATIC_EXPORT=1 npm run build

      # --- Terraform Validation ---
      - name: Setup Terraform
        if: needs.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"

      - name: Terraform Format Check
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform-wiki
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init & Validate
        if: needs.changes.outputs.infra == 'true'
        working-directory: ./terraform-wiki
        run: |
          terraform init -backend=false
          terraform validate

      # --- Ansible Validation ---
      - name: Setup Python
        if: needs.changes.outputs.ansible == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        if: needs.changes.outputs.ansible == 'true'
        run: pip install ansible

      - name: Ansible Syntax Check
        if: needs.changes.outputs.ansible == 'true'
        working-directory: ./ansible
        run: ansible-playbook playbook.yml --syntax-check

  # ============================================================
  # Job 3: Unified Provision & Deploy (Via Terraform Action)
  # ============================================================
  provision:
    name: "Provision & Deploy (Terraform Action)"
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      web_ip: ${{ steps.tf_output.outputs.web_ip }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for wiki build
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build wiki for deployment
        working-directory: ./app
        run: |
          npm ci
          SITE_STATIC_EXPORT=1 npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Verify target AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT_ID" = "858039354188" || { echo "Wrong AWS account: $ACCOUNT_ID"; exit 1; }

      - name: Setup Python for Ansible Provider
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible Dependencies
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws community.postgresql community.general

      - name: Create S3 bucket for Terraform state
        run: |
          BUCKET="evergarden-wiki-tfstate-858039354188"
          REGION="ap-southeast-7"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "S3 bucket '$BUCKET' already exists"
          else
            echo "Creating S3 bucket '$BUCKET'..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "Bucket created successfully"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "latest"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ./terraform-wiki
        run: terraform init

      - name: Prepare SSH Key
        working-directory: ./terraform-wiki
        run: |
          terraform output -raw private_key_pem > /tmp/id_rsa 2>/dev/null || true
          if [ -s /tmp/id_rsa ]; then
            chmod 600 /tmp/id_rsa
            echo "Existing SSH key loaded"
          else
            echo "New deployment: key will be generated by Terraform"
          fi

      - name: Terraform Apply
        working-directory: ./terraform-wiki
        run: |
          terraform apply -auto-approve
          terraform output -raw private_key_pem > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
          ssh-keygen -l -f /tmp/id_rsa && echo "Key is valid"

      - name: Get Terraform Outputs
        id: tf_output
        working-directory: ./terraform-wiki
        run: |
          WEB_IP=$(terraform output -raw web_server_public_ip 2>/dev/null || echo "")
          echo "web_ip=${WEB_IP}" >> $GITHUB_OUTPUT
          echo ""
          echo "====================================="
          echo "Infrastructure Summary"
          echo "====================================="
          echo "Web Server IP: ${WEB_IP}"
          echo "Web URL:        http://${WEB_IP}"
          echo "====================================="

      - name: Wait for SSH to be ready
        run: |
          WEB_IP="${{ steps.tf_output.outputs.web_ip }}"
          echo "Checking SSH readiness on ${WEB_IP}:22..."
          for i in {1..20}; do
            if nc -z -w 3 "$WEB_IP" 22 2>/dev/null; then
              echo "SSH is ready on ${WEB_IP}!"
              break
            fi
            echo "Waiting for SSH (attempt $i/20)..."
            sleep 3
          done

      - name: Run Terraform Action (action.ansible_playbook_run)
        working-directory: ./terraform-wiki
        run: |
          echo "===================================================="
          echo "Executing Action: action.ansible_playbook_run.with_inventories"
          echo "===================================================="
          
          # ดึง Configuration ทั้งหมดที่ประกาศไว้ใน ansible.tf Action ผ่าน Terraform Outputs
          terraform output -raw ansible_inventory_json > /tmp/inventory.json
          PLAYBOOK_PATH=$(terraform output -raw ansible_playbook_path)
          EXTRA_VARS_JSON=$(terraform output -json ansible_extra_vars)

          echo "Terraform Action Playbook Path: ${PLAYBOOK_PATH}"
          echo "Terraform Action Inventory:"
          cat /tmp/inventory.json
          echo ""

          # สั่งรัน Playbook โดยใช้ Path, Inventory และ Extra Vars ที่ได้จาก Terraform Action
          ANSIBLE_CONFIG="../ansible/ansible.cfg" ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook \
            -i /tmp/inventory.json \
            "${PLAYBOOK_PATH}" \
            --extra-vars "${EXTRA_VARS_JSON}" \
            --private-key /tmp/id_rsa \
            -u ubuntu \
            -v

      - name: Cleanup SSH Key
        if: always()
        run: rm -f /tmp/id_rsa

  # ============================================================
  # Job 4: Smoke Test
  # ============================================================
  smoke-test:
    name: "Smoke Test"
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Test wiki homepage and guide
        run: |
          WEB_IP="${{ needs.provision.outputs.web_ip }}"
          for i in {1..15}; do
            if curl --fail --silent --max-time 5 "http://${WEB_IP}/evergardenwiki/" | grep -q "Evergarden" && \
               curl --fail --silent --max-time 5 "http://${WEB_IP}/evergardenwiki/guide/getting-started/world" > /dev/null; then
              echo "Wiki is available"
              exit 0
            fi
            sleep 3
          done
          echo "Wiki smoke test failed"
          exit 1
