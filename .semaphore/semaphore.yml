# GitHub Actions deploys the wiki. This backup pipeline only validates it.
version: v1.0
name: "Evergarden Wiki Validation"

agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2204

blocks:
  - name: "Validate wiki"
    task:
      jobs:
        - name: "Build static wiki"
          commands:
            - checkout
            - sem-version node 24
            - cd app
            - npm ci
            - npm run typecheck
            - SITE_STATIC_EXPORT=1 npm run build

  - name: "Validate Ansible"
    task:
      jobs:
        - name: "Playbook syntax"
          commands:
            - checkout
            - pip install ansible
            - cd ansible
            - ansible-playbook playbook.yml --syntax-check
