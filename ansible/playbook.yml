---
- name: Deploy Evergarden Wiki
  hosts: tag_Role_web
  become: true
  roles:
    - web
  post_tasks:
    - name: Verify wiki homepage through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/evergardenwiki/
        status_code: 200
        return_content: true
      register: wiki_home
      failed_when: "wiki_home.status != 200 or 'Evergarden' not in wiki_home.content"

    - name: Verify a wiki guide page
      ansible.builtin.uri:
        url: http://127.0.0.1/evergardenwiki/guide/getting-started/world
        status_code: 200
