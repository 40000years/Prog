# ============================================================
# Main Playbook - จัดการทั้ง Web Server และ DB Server
# ============================================================

# ----------------------------------------------------------
# Play 1: ตั้งค่า Database Server
# ----------------------------------------------------------
- name: Setup Database Server
  hosts: tag_Role_db
  become: true
  roles:
    - db

# ----------------------------------------------------------
# Play 2: ตั้งค่า Web Server
# ----------------------------------------------------------
- name: Setup Web Server
  hosts: tag_Role_web
  become: true
  roles:
    - web
