# ============================================================
# Web Role - Tasks: ติดตั้ง Nginx + Node.js + Deploy App
# ============================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Install Node.js prerequisites
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present

- name: Add NodeSource GPG key
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Add NodeSource repository (Node.js 20 LTS)
  ansible.builtin.shell: |
    set -o pipefail
    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Update apt cache after adding NodeSource
  ansible.builtin.apt:
    update_cache: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/myapp
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Copy application code to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/index.js"
    dest: /opt/myapp/index.js
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Restart Node App

- name: Copy package.json for the application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/package.json"
    dest: /opt/myapp/package.json
    owner: www-data
    group: www-data
    mode: "0644"
  notify: Restart Node App

- name: Install Node.js dependencies
  community.general.npm:
    path: /opt/myapp
    state: present
  become: true
  become_user: root

- name: Create systemd service for Node.js app
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Mega Automation Lab Node.js App
      After=network.target

      [Service]
      Type=simple
      User=www-data
      WorkingDirectory=/opt/myapp
      ExecStart=/usr/bin/node /opt/myapp/index.js
      Restart=on-failure
      RestartSec=10
      Environment=NODE_ENV=production
      Environment=PORT=3000
      Environment=DB_HOST={{ (groups['tag_Role_db'] is defined and groups['tag_Role_db'] | length > 0) | ternary(hostvars[groups['tag_Role_db'][0]]['private_ip_address'] | default('127.0.0.1', true), '127.0.0.1') }}
      Environment=DB_NAME=myapp_db
      Environment=DB_USER=myapp_user
      Environment=DB_PASSWORD={{ db_password | default('SuperSecretPass123!') }}

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/myapp.service
    mode: "0644"
  notify: Restart Node App

- name: Configure Nginx as reverse proxy
  ansible.builtin.copy:
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
          }
      }
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Restart Nginx

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Enable and start Node.js app
  ansible.builtin.systemd:
    name: myapp
    enabled: true
    state: started
    daemon_reload: true
