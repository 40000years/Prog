# ============================================================
# Web Role - Tasks: ติดตั้ง Nginx + Node.js + Deploy App
# ============================================================

- name: Wait for apt locks to be released
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      echo "Waiting for apt locks to release..."
      sleep 3
    done
  changed_when: false
  tags:
    - setup

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - setup

- name: Install Nginx and prerequisites
  ansible.builtin.apt:
    name:
      - nginx
      - curl
      - ca-certificates
      - gnupg
    state: present
  tags:
    - setup
    - nginx

- name: Setup NodeSource repository (Node.js 20 LTS)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/nodesource.list
  tags:
    - setup
    - nodejs

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
  tags:
    - setup
    - nodejs

- name: Create application directory
  ansible.builtin.file:
    path: /opt/myapp
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  tags:
    - setup
    - deploy
    - app

- name: Copy entire application directory to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/"
    dest: /opt/myapp/
    owner: www-data
    group: www-data
    mode: "0755"
  notify: Restart Node App
  tags:
    - deploy
    - app

- name: Install Node.js dependencies
  community.general.npm:
    path: /opt/myapp
    state: present
  become: true
  become_user: root
  tags:
    - deploy
    - app

- name: Create systemd service for Node.js app
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Mega Automation Lab Node.js App
      After=network.target

      [Service]
      Type=simple
      User=www-data
      WorkingDirectory=/opt/myapp
      ExecStart=/usr/bin/node /opt/myapp/index.js
      Restart=on-failure
      RestartSec=10
      Environment=NODE_ENV=production
      Environment=PORT=3000
      Environment=DB_HOST={{ (groups['tag_Role_db'] is defined and groups['tag_Role_db'] | length > 0) | ternary(hostvars[groups['tag_Role_db'][0]]['private_ip_address'] | default('127.0.0.1', true), '127.0.0.1') }}
      Environment=DB_NAME=myapp_db
      Environment=DB_USER=myapp_user
      Environment=DB_PASSWORD={{ db_password | default('SuperSecretPass123!') }}

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/myapp.service
    mode: "0644"
  notify: Restart Node App
  tags:
    - deploy
    - app

- name: Configure Nginx as reverse proxy
  ansible.builtin.copy:
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:3000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_cache_bypass $http_upgrade;
          }
      }
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Restart Nginx
  tags:
    - setup
    - nginx

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  tags:
    - setup
    - nginx

- name: Enable and restart Node.js app
  ansible.builtin.systemd:
    name: myapp
    enabled: true
    state: restarted
    daemon_reload: true
  tags:
    - deploy
    - app
