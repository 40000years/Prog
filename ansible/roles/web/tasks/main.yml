---
- name: Install Nginx
  ansible.builtin.apt:
    name:
      - nginx
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nginx_install
  retries: 5
  delay: 5
  until: nginx_install is success

- name: Create wiki directory
  ansible.builtin.file:
    path: /var/www/evergarden
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize built wiki to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../app/out/"
    dest: /var/www/evergarden/
    delete: true
    recursive: true
    archive: false
    checksum: true
    rsync_opts:
      - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

- name: Check existing services
  ansible.builtin.service_facts:

- name: Stop and disable the old store service
  ansible.builtin.systemd:
    name: myapp
    state: stopped
    enabled: false
  when: "'myapp.service' in ansible_facts.services"

- name: Configure Nginx to serve the wiki
  ansible.builtin.copy:
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          root /var/www/evergarden;
          index index.html;
          error_page 404 /404.html;

          location / {
              try_files $uri $uri.html $uri/ =404;
          }
      }
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Apply Nginx configuration before verification
  ansible.builtin.meta: flush_handlers
