---
- name: Install Nginx
  ansible.builtin.apt:
    name:
      - nginx
      - rsync
      - certbot
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: nginx_install
  retries: 5
  delay: 5
  until: nginx_install is success

- name: Create wiki directory
  ansible.builtin.file:
    path: /var/www/evergarden
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Synchronize built wiki to server
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../app/out/"
    dest: /var/www/evergarden/
    delete: true
    recursive: true
    archive: false
    checksum: true
    rsync_opts:
      - "--chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r"

- name: Check existing services
  ansible.builtin.service_facts:

- name: Stop and disable the old store service
  ansible.builtin.systemd:
    name: myapp
    state: stopped
    enabled: false
  when: "'myapp.service' in ansible_facts.services"

- name: Check for the wiki TLS certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/www.bowrxn.com/fullchain.pem
  register: wiki_certificate

- name: Check for the root domain TLS certificate
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/bowrxn.com/fullchain.pem
  register: wiki_root_certificate

- name: Create certificate renewal hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: "0755"

- name: Install certificate renewal hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
    content: |
      #!/bin/sh
      systemctl reload nginx
    mode: "0755"

- name: Configure Nginx to serve the wiki
  ansible.builtin.copy:
    content: |
      server {
          listen 80;
          listen [::]:80;
          server_name bowrxn.com;

          location ^~ /.well-known/acme-challenge/ {
              root /var/www/evergarden;
          }

          location / {
              return 301 https://www.bowrxn.com$request_uri;
          }
      }
      {% if wiki_root_certificate.stat.exists %}
      server {
          listen 443 ssl;
          listen [::]:443 ssl;
          server_name bowrxn.com;
          ssl_certificate /etc/letsencrypt/live/bowrxn.com/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/bowrxn.com/privkey.pem;
          return 301 https://www.bowrxn.com$request_uri;
      }
      {% endif %}

      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name www.bowrxn.com _;
      {% if wiki_certificate.stat.exists %}
          listen 443 ssl;
          listen [::]:443 ssl;
          ssl_certificate /etc/letsencrypt/live/www.bowrxn.com/fullchain.pem;
          ssl_certificate_key /etc/letsencrypt/live/www.bowrxn.com/privkey.pem;
      {% endif %}
          root /var/www/evergarden;
          index index.html;
          error_page 404 /404.html;

          location = / {
              return 302 /evergardenwiki/;
          }

          location = /evergardenwiki {
              return 301 /evergardenwiki/;
          }

          location /evergardenwiki/ {
              rewrite ^/evergardenwiki/(.*)$ /$1 break;
              try_files $uri $uri.html $uri/ =404;
          }

          location / {
              try_files $uri =404;
          }
      }
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Apply Nginx configuration before verification
  ansible.builtin.meta: flush_handlers
