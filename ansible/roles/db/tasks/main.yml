# ============================================================
# DB Role - Tasks: ติดตั้ง PostgreSQL
# ============================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install PostgreSQL and dependencies
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2  # จำเป็นสำหรับ Ansible postgresql modules
    state: present

- name: Ensure PostgreSQL is started and enabled
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Configure PostgreSQL to listen on all interfaces
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
    state: present
  notify: Restart PostgreSQL

- name: Allow connections from VPC subnet in pg_hba.conf
  ansible.builtin.lineinfile:
    path: /etc/postgresql/14/main/pg_hba.conf
    line: "host    all             all             10.0.0.0/16             md5"
    state: present
    insertafter: "^# IPv4 local connections"
  notify: Restart PostgreSQL

- name: Create application database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: myapp_db
    state: present

- name: Create application database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: myapp_user
    password: "{{ db_password | default('SuperSecretPass123!') }}"
    state: present

- name: Grant privileges to application database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    db: myapp_db
    role: myapp_user
    privs: ALL
    type: database
    state: present
