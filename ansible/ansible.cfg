# ============================================================
# Ansible Configuration
# ============================================================
[defaults]
# ปิดการเช็ค Host Key เพื่อให้ Automation ทำงานได้โดยไม่ต้อง approve manual
host_key_checking = False

# ใช้ SSH pipelining เพิ่มความเร็ว
pipelining = True

# ตั้ง timeout ให้นานขึ้นสำหรับ EC2 ที่เพิ่งสร้างใหม่
timeout = 30

# Remote user ค่าเริ่มต้น
remote_user = ubuntu

# ไม่แสดง deprecation warnings
deprecation_warnings = False

# Roles path
roles_path = ./roles

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
