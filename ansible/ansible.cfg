# ============================================================
# Ansible Configuration
# ============================================================
[defaults]
host_key_checking = False
pipelining = True
timeout = 30
remote_user = ubuntu
deprecation_warnings = False
roles_path = ./roles
allow_world_readable_tmpfiles = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
